backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. SEKCE: ELEKTRONICKÉ PROJEKTY
  - name: "projekty"
    label: "Projekty"
    folder: "src/data/projekty"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Identifikátor (slug)", name: "slug", widget: "string" }
      - { label: "Název projektu", name: "title", widget: "string" }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: ["ESP32", "Arduino", "Napájení", "Mikroelektronika", "Opravy", "DIY", "3D tisk", "Ostatní"]
      - { label: "Stručný popis (karta)", name: "shortDescription", widget: "string" }
      - { label: "Hlavní obrázek", name: "image", widget: "image" }
      - { label: "Popis obrázku (Alt text)", name: "imageAlt", widget: "string" }
      - { label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Zvýrazněný projekt (Featured)", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Účel projektu", name: "purpose", widget: "text" }
      - { label: "Podrobný popis", name: "description", widget: "markdown" }
      - label: "Použité součástky"
        name: "components"
        widget: "list"
        required: false
        fields:
          - { label: "Název součástky", name: "name", widget: "string" }
          - { label: "Množství", name: "qty", widget: "string" }
          - { label: "Odkaz na součástku", name: "link", widget: "string", required: false }
      - label: "Kroky postupu"
        name: "steps"
        widget: "list"
        required: false
        fields:
          - { label: "Název kroku", name: "title", widget: "string" }
          - { label: "Popis kroku", name: "body", widget: "markdown" }
      - { label: "Poznámky", name: "notes", widget: "text", required: false }
      - label: "Užitečné odkazy"
        name: "links"
        widget: "list"
        required: false
        fields:
          - { label: "Název odkazu", name: "label", widget: "string" }
          - { label: "URL adresa", name: "url", widget: "string" }
      - { label: "Zdrojový kód", name: "code", widget: "code", required: false }
      - label: "Galerie fotek"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Fotka", name: "image", widget: "image" }

  # 2. SEKCE: VAŘENÍ A RECEPTY
  - name: "recepty"
    label: "Recepty"
    folder: "src/data/recepty"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Identifikátor (slug)", name: "slug", widget: "string" }
      - { label: "Název receptu", name: "title", widget: "string" }
      - { label: "Stručný popis (karta)", name: "shortDescription", widget: "string" }
      - { label: "Fotka receptu", name: "image", widget: "image" }
      - { label: "Popis fotky (Alt text)", name: "imageAlt", widget: "string" }
      - { label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Úvod k receptu", name: "intro", widget: "text" }
      - { label: "Počet porcí", name: "servings", widget: "string", required: false }
      - { label: "Doba přípravy", name: "prepTime", widget: "string", required: false }
      - label: "Suroviny"
        name: "ingredients"
        widget: "list"
        fields:
          - { label: "Název suroviny", name: "name", widget: "string" }
          - { label: "Množství", name: "amount", widget: "string" }
      - label: "Kroky přípravy"
        name: "steps"
        widget: "list"
        fields:
          - { label: "Postup kroku", name: "body", widget: "markdown" }
      - { label: "Poznámky pod čarou", name: "notes", widget: "text", required: false }
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1117" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>

  {/* IC body */}
  <rect x="18" y="14" width="28" height="36" rx="3" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="2.5"/>

  {/* Pin 1 indicator dot */}
  <circle cx="22" cy="18" r="1.8" fill="#00d4ff" fill-opacity="0.5"/>

  {/* Left pins (1-4) */}
  <line x1="18" y1="22" x2="10" y2="22" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="18" y1="30" x2="10" y2="30" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="18" y1="38" x2="10" y2="38" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="10" y2="46" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>

  {/* Right pins (8-5) */}
  <line x1="46" y1="22" x2="54" y2="22" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="54" y2="30" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="46" y1="38" x2="54" y2="38" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="46" y1="46" x2="54" y2="46" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round"/>

  {/* Pin numbers */}
  <text x="20" y="24" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">1</text>
  <text x="20" y="32" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">2</text>
  <text x="20" y="40" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">3</text>
  <text x="20" y="48" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">4</text>
  <text x="39" y="24" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">8</text>
  <text x="39" y="32" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">7</text>
  <text x="39" y="40" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">6</text>
  <text x="39" y="48" font-size="5" fill="#00d4ff" fill-opacity="0.6" font-family="monospace">5</text>

  {/* Inner glow core */}
  <circle cx="32" cy="32" r="4" fill="#00d4ff" fill-opacity="0.15"/>
  <circle cx="32" cy="32" r="2" fill="#00d4ff" fill-opacity="0.5"/>
</svg>
